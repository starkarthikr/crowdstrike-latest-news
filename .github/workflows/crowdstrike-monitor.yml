name: CrowdStrike News Monitor

on:
  schedule:
    # Runs every 6 hours (at 00:00, 06:00, 12:00, 18:00 UTC)
    - cron: '0 */6 * * *'
  workflow_dispatch:  # Allows manual trigger

jobs:
  fetch-crowdstrike-updates:
    runs-on: ubuntu-latest
    
    permissions:
      contents: write
      issues: write
      
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          
      - name: Install dependencies
        run: |
          pip install feedparser requests beautifulsoup4 python-dateutil
          
      - name: Fetch CrowdStrike RSS Feeds
        run: python scripts/parse_crowdstrike_feeds.py
        
      - name: Commit and push if changed
        run: |
          git config --global user.name 'CrowdStrike Bot'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --quiet && git diff --staged --quiet || (git commit -m "Update CrowdStrike news - $(date +'%Y-%m-%d %H:%M:%S')" && git push)
